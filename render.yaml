services:
  - type: web
    name: calling-agent-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: REDIS_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: USE_ARQ_QUEUE
        value: "true"
      - key: TELNYX_API_KEY
        sync: false
      - key: TELNYX_PHONE_NUMBER
        sync: false
      - key: TELNYX_CONNECTION_ID
        sync: false
      - key: TELNYX_MESSAGING_PROFILE_ID
        sync: false
      - key: NEXT_JS_SERVICE_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: WEBHOOK_CALL
        sync: false
      - key: WEBHOOK_SMS
        sync: false
      - key: WEBHOOK_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false

  - type: worker
    name: calling-agent-oncall-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: arq oncall_worker.OnDemandWorkerSettings
    envVars:
      - key: REDIS_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
